name: Flask CI/CD

on:
  push:
    branches:
      - main

    paths-ignore:
      - 'helm/**'
      - 'README.md'

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Tests
        run: pytest


  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flake8
        run: pip install flake8

      - name: Lint
        run: flake8 app.py tests/


  docker:
    runs-on: ubuntu-latest

    needs:
      - test
      - code-quality

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-cicd:${{ github.run_id }}


  update-helm:
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - name: Update Helm Image Tag
        run: |
          sed -i 's/tag: .*/tag: "${{ github.run_id }}"/' helm/flask-app/values.yaml

      - name: Commit Helm Change
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add helm/flask-app/values.yaml

          git commit -m "Update Flask image to ${{ github.run_id }}"

          git push